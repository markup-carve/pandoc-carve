name: EOL runtimes

# Node versions past end of life that package.json still declares (engines).
# They stay tested here, daily, against both Pandoc tracks of ci.yml, instead
# of on every PR. Keep the Pandoc versions in step with ci.yml.
on:
  schedule:
    - cron: '41 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.track == 'current' && format('test ({0})', matrix.node) || format('compatibility ({0})', matrix.node) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [20]
        track: [current, minimum]
        include:
          - track: current
            pandoc: '3.11'
          - track: minimum
            pandoc: '3.10.2'
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: Install pandoc
        run: |
          curl -fsSL -o /tmp/pandoc.deb https://github.com/jgm/pandoc/releases/download/${{ matrix.pandoc }}/pandoc-${{ matrix.pandoc }}-1-amd64.deb
          sudo dpkg -i /tmp/pandoc.deb
          pandoc --version | head -1
      - run: npm ci
      - run: npm test
