name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.pandoc == '3.11' && format('test ({0})', matrix.node) || format('compatibility ({0}, {1})', matrix.node, matrix.pandoc) }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
        pandoc: ['3.11', '3.10.2']
    steps:
      - uses: actions/checkout@v7
        with:
          # The spec corpus is a submodule, and test/spec-corpus.test.mjs FAILS
          # rather than skips without it - a skipped corpus reads like a converted
          # one in a CI log.
          submodules: recursive
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: Verify package version has release notes
        run: |
          VER="$(node -p "require('./package.json').version")"
          if ! grep -qE "^## \[?${VER//./\\.}\]?([[:space:]]|$)" CHANGELOG.md; then
            echo "::error::package.json is $VER but CHANGELOG.md has no matching release section."
            exit 1
          fi
      - name: Install pandoc
        run: |
          curl -fsSL -o /tmp/pandoc.deb https://github.com/jgm/pandoc/releases/download/${{ matrix.pandoc }}/pandoc-${{ matrix.pandoc }}-1-amd64.deb
          sudo dpkg -i /tmp/pandoc.deb
          pandoc --version | head -1
      - run: npm ci
      - run: npm test
