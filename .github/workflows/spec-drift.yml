name: Spec drift

# The `spec` submodule is a pin, and nothing here watched it. This repo is the
# only submodule-carrying repository in the org without this job: every sibling
# has one (vscode-carve's lives inside `engine-drift.yml` as a `spec-pin` job),
# and this one was current purely because carve's `bump-downstream` workflow
# happened to keep merging its bumps (carve#735).
#
# "Happens to be current" is not a check. `engine-drift.yml` next to this file
# watches the ENGINE - what renders a document - and says nothing about the
# corpus this repo tests against. When bump-downstream skips this repo, or its
# PR sits unmerged, the AST fixtures under `tests/` keep a green tick over an
# old language and nothing says so.
#
# Reported, not gated: carve `main` moves several times a day, so failing on lag
# would be red most mornings and teach people to ignore the job. It DOES fail if
# the pin is not a commit on carve `main` - an unreachable or off-main pin means
# a fresh clone cannot check the submodule out at all, which has happened in
# this org before (carve#499).

on:
  schedule:
    # 05:00 UTC daily, alongside engine-drift.yml and the other drift runs.
    - cron: "0 5 * * *"
  workflow_dispatch:

jobs:
  spec-pin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out the spec
        uses: actions/checkout@v4
        with:
          repository: markup-carve/carve
          path: carve-spec
          fetch-depth: 0

      - name: Compare the spec submodule against carve main
        run: |
          set -euo pipefail
          rev="$(git rev-parse HEAD:spec)"
          if ! git -C carve-spec cat-file -e "${rev}^{commit}" 2>/dev/null; then
            echo "::error::the spec submodule pins ${rev}, which is not a commit in markup-carve/carve"
            exit 1
          fi
          if ! git -C carve-spec merge-base --is-ancestor "${rev}" origin/main; then
            echo "::error::spec ${rev} is not on main, so the pin came from an unmerged or rewritten branch"
            exit 1
          fi
          behind="$(git -C carve-spec rev-list --count "${rev}..origin/main")"
          corpus="$(git -C carve-spec ls-tree -r --name-only "${rev}" tests/corpus | grep -c '\.crv$' || true)"
          latest="$(git -C carve-spec ls-tree -r --name-only origin/main tests/corpus | grep -c '\.crv$' || true)"
          echo "spec pin: ${rev} ($(git -C carve-spec log -1 --format=%s "${rev}"))"
          echo "carve main is ${behind} commit(s) ahead; corpus ${corpus} -> ${latest} documents"
          if [ "${behind}" -gt 0 ]; then
            echo "::warning::the spec submodule is ${behind} commit(s) behind carve main (corpus ${corpus} vs ${latest} documents)"
          fi
