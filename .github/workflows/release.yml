name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          # The spec corpus is a submodule and test/spec-corpus.test.mjs FAILS
          # rather than skips without it, same as in CI.
          submodules: recursive
          fetch-depth: 0

      - name: Verify the release tag is on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Release tag $GITHUB_REF_NAME is not on the main line."
            exit 1
          fi

      # Guard: package.json version AND the CHANGELOG must match the release
      # tag, so a mistyped tag, a forgotten version bump, or an un-cut changelog
      # cannot publish the wrong version. (carve-js and carve-rs run the
      # equivalent guard.)
      - name: Verify version and changelog match the tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          VER="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$VER" ]; then
            echo "::error::Release tag $TAG does not match package.json version $VER."
            exit 1
          fi
          if ! grep -qE "^## \[?${TAG//./\\.}\]?" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## $TAG' section; cut it from Unreleased before tagging."
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      # A git dependency in runtime `dependencies` ships to every consumer: their
      # npm re-resolves the spec out of this tarball's manifest, so the install
      # needs git and GitHub reachability and has no registry tarball to check an
      # integrity hash against. 0.1.0 and 0.1.1 both went out that way, 0.1.2
      # moved the engine to `^0.1.4` and said so under Changed, and a later
      # branch put it back - because nothing inspected the manifest before a
      # publish. markup-carve/carve-grammars#276 added the same check there.
      #
      # This step FAILS today, and that is the intended state: the engine is
      # pinned to a carve-js commit because this bridge reads `Table.columns`,
      # which no published engine has. Until carve-js publishes one that does,
      # this repo should not publish either, and now it cannot do so by accident.
      - name: No dependency is installed over git
        run: node scripts/no-git-dependencies.mjs

      # The same pandoc CI installs. Without it the suite SKIPS every check that
      # needs pandoc - the example goldens, the metadata comparisons against
      # pandoc's own reader - so the release gate would be weaker than the gate
      # every pull request already passed.
      - name: Install pandoc
        run: |
          curl -sSL -o /tmp/pandoc.deb https://github.com/jgm/pandoc/releases/download/3.10.2/pandoc-3.10.2-1-amd64.deb
          sudo dpkg -i /tmp/pandoc.deb
          pandoc --version | head -1

      - run: npm ci
      - run: npm run build
      - run: npm test

      # Publish authenticates via the NPM_TOKEN repo secret (a granular token
      # with read/write on the @markup-carve scope). setup-node already wrote
      # the registry .npmrc; NODE_AUTH_TOKEN supplies the credential.
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public
